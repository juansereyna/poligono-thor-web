        var v = lookup(whole[1], scopes);
        if (v === false || v == null) {
          if (name.indexOf('aria-') === 0 && v === false) el.setAttribute(name, 'false');
          continue;
        }
        el.setAttribute(name, v === true ? (name.indexOf('aria-') === 0 ? 'true' : '') : String(v));
      } else if (value.indexOf('{{') >= 0) {
        el.setAttribute(name, interp(value, scopes));
      } else {
        el.setAttribute(name, value);
      }
    }
    var children = [];
    renderNodes(node, scopes, children);
    for (var c = 0; c < children.length; c++) el.appendChild(children[c]);
    if (tag === 'input' && el.hasAttribute('value')) el.value = el.getAttribute('value');
    out.push(el);
  }

  var pending = false, first = true;
  function schedule() {
    if (pending) return;
    pending = true;
    Promise.resolve().then(function () { pending = false; render(); });
  }

  function render() {
    var active = document.activeElement;
    var activeId = active && active.id && app.contains(active) ? active.id : null;
    var sel = null;
    try { if (activeId && typeof active.selectionStart === 'number') sel = active.value.length - active.selectionStart; } catch (e) {}
    var openDetails = Array.prototype.map.call(app.querySelectorAll('details'), function (d) { return d.open; });

    var vals = comp.renderVals ? comp.renderVals() : {};
    var out = [];
    renderNodes(tpl.content, [vals], out);
    app.replaceChildren.apply(app, out);

    var ds = app.querySelectorAll('details');
    if (ds.length === openDetails.length) ds.forEach(function (d, i) { if (openDetails[i]) d.open = true; });
    if (activeId) {
      var n = document.getElementById(activeId);
      if (n) {
        n.focus({ preventScroll: true });
        try { if (sel != null && typeof n.setSelectionRange === 'function') { var p = n.value.length - sel; n.setSelectionRange(p, p); } } catch (e) {}
      }
    }
    app.querySelectorAll('form').forEach(function (f) { f.addEventListener('submit', function (e) { e.preventDefault(); }); });
    if (first) {
      first = false;
      if (comp.componentDidMount) try { comp.componentDidMount(); } catch (e) {}
      if (location.hash && location.hash.length > 1) {
        var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }
    }
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var t = id && document.getElementById(id);
    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  });

  render();
})();
</script>

<summary style="display: flex; justify-content: space-between; gap: 24px; align-items: center; min-height: 76px; font-size: 20px; font-weight: 700;">¿Necesito permiso para disparar en el polígono?<span class="mk" aria-hidden="true" style="font-size: 30px; font-weight: 400;">+</span></summary>
<p style="margin: 0; padding-bottom: 26px; max-width: 680px;">No. Si no tienes arma propia, disparas siempre con un arma del polígono y con un instructor a tu lado, después de la clase teórica. Solo necesitas ser mayor de edad y traer tu documento.</p>
</details>
<details style="background: #ffffff; padding: 0 28px;">
<summary style="display: flex; justify-content: space-between; gap: 24px; align-items: center; min-height: 76px; font-size: 20px; font-weight: 700;">¿Puedo disparar si soy extranjero?<span class="mk" aria-hidden="true" style="font-size: 30px; font-weight: 400;">+</span></summary>
<p style="margin: 0; padding-bottom: 26px; max-width: 680px;">Sí. Cualquier adulto, colombiano o extranjero, puede tomar una lección presentando su pasaporte o cédula de extranjería.</p>
</details>
<details style="background: #ffffff; padding: 0 28px;">
<summary style="display: flex; justify-content: space-between; gap: 24px; align-items: center; min-height: 76px; font-size: 20px; font-weight: 700;">¿El certificado DCCAE me da el permiso de porte?<span class="mk" aria-hidden="true" style="font-size: 30px; font-weight: 400;">+</span></summary>
<p style="margin: 0; padding-bottom: 26px; max-width: 680px;">No. El certificado acredita tu formación en manejo seguro y sirve como soporte en trámites como la revalidación del porte, pero el permiso lo expide el DCCAE después de su propio proceso.</p>
</details>
<details style="background: #ffffff; padding: 0 28px;">
<summary style="display: flex; justify-content: space-between; gap: 24px; align-items: center; min-height: 76px; font-size: 20px; font-weight: 700;">¿Puedo llevar mi propia arma al polígono?<span class="mk" aria-hidden="true" style="font-size: 30px; font-weight: 400;">+</span></summary>
<p style="margin: 0; padding-bottom: 26px; max-width: 680px;">Sí, si está legalmente registrada y tienes tu permiso vigente. Transpórtala descargada, en estuche y separada de la munición.</p>

<details style="background: #ffffff; padding: 0 28px;">
<summary style="display: flex; justify-content: space-between; gap: 24px; align-items: center; min-height: 76px; font-size: 20px; font-weight: 700;">¿Un arma traumática necesita permiso?<span class="mk" aria-hidden="true" style="font-size: 30px; font-weight: 400;">+</span></summary>
<p style="margin: 0; padding-bottom: 26px; max-width: 680px;">Las armas traumáticas y menos letales tienen un régimen propio (Decretos 1417 de 2021 y 1563 de 2022 y Sentencia C-014 de 2023). Si portarlas sin permiso configura delito sigue en discusión jurídica; consulta con un abogado.</p>
</details>
<details style="background: #ffffff; padding: 0 28px;">

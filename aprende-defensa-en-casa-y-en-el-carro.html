<h1 class="d" style="margin: 0; font-size: clamp(48px, 5.6vw, 88px);">Defensa en casa o en el carro: qué cambió con la Ley 2197 de 2022</h1>
<p style="margin: 0; font-size: 21px; max-width: 760px;">La llamada legítima defensa privilegiada pone la presunción a tu favor cuando un extraño entra a tu vivienda o tu vehículo. Pero tiene límites.</p>
<p style="margin: 0; font-size: 15px; color: #57534b;">5 min de lectura · Equipo Polígono Thor</p>
</header>
<figure class="wrap" style="margin: 0 auto; padding-bottom: 8px;">
<div class="ph" style="aspect-ratio: 21 / 9;"><img src="https://images.unsplash.com/photo-1573051113020-24a8d0c1a3b5?auto=format&fit=crop&w=1600&q=70" alt="Pasillo interior de una casa" fetchpriority="high" decoding="async"></div>
<figcaption style="margin-top: 10px; font-size: 14px; color: #57534b;">Foto: <a href="https://unsplash.com/photos/architectural-photography-of-hallway-LYmsz-TPEXA" style="color: #57534b;">Ainsley Myles</a> en Unsplash</figcaption>
</figure>
<div class="wrap" style="padding-top: 48px;">
<div class="prose" style="max-width: 720px; margin: 0 auto;">

<p>La Ley de Seguridad Ciudadana (Ley 2197 de 2022), sancionada el 25 de enero de 2022, modificó el artículo 32 del Código Penal e introdujo el numeral 6.1: la <strong>legítima defensa privilegiada</strong>.</p>
<h2>¿Qué dice?</h2>
<p>Se presume legítima la defensa contra un extraño que entra o permanece sin derecho en tu <strong>vivienda, sus dependencias o un vehículo ocupado</strong>. Excepcionalmente, admite incluso fuerza letal.</p>
<h2>¿Qué cambia en la práctica?</h2>
<p>La carga de la prueba se invierte a tu favor: en principio, se presume que actuaste legítimamente y es la otra parte la que tendría que demostrar lo contrario.</p>
<div class="callout"><p><strong>Una presunción no es una licencia.</strong> Puede desvirtuarse con pruebas, y los principios de proporcionalidad siguen aplicando. No es lo mismo repeler a alguien que entra armado de noche que disparar a alguien que ya huye por la ventana.</p></div>
<h2>Otros cambios de la Ley 2197</h2>
<ul>
<li>Creó delitos como la intimidación con arma de fuego, arma blanca o dispositivos menos letales.</li>
<li>Penalizó el porte de arma blanca en eventos masivos o en transporte público.</li>
<li>Estableció permisos para armas menos letales y aumentó agravantes.</li>
</ul>
<h2>Cómo se entrena esto</h2>
<p>Los cursos de <strong>Protección en el hogar</strong> (despeje de habitaciones) y <strong>Protección en el vehículo</strong> de Polígono Thor se dictan con esta norma como marco: primero lo que dice la ley, luego la técnica, y siempre la toma de decisiones.</p>
<p class="small">Contenido educativo, no asesoría jurídica. El Decreto 207 de 2022 corrigió errores de numeración de la ley; consulta el texto vigente en SUIN-Juriscol.</p>

</div>

      if (location.hash && location.hash.length > 1) {
        var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }
    }
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var t = id && document.getElementById(id);
    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  });

  render();
})();
</script>
</body>

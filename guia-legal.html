<h1 class="d" style="margin: 0; font-size: clamp(56px, 6.6vw, 104px); max-width: 1080px;">Legítima defensa y armas en Colombia</h1>
<p style="margin: 0; max-width: 720px; font-size: 21px;">Lo que todo tirador debe saber sobre el uso, la tenencia y el porte de armas de fuego, en lenguaje claro.</p>
</section>

<section id="resumen" class="art" style="background: #151515; color: #f2efe7; padding: 44px;">
<h2>Resumen en 30 segundos</h2>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 12px;">
<li>La legítima defensa solo aplica ante una agresión injusta, actual o inminente; nunca pasada ni futura.</li>
<li>En tu vivienda o tu vehículo la ley presume a tu favor, pero la respuesta debe seguir siendo proporcional.</li>
<li>Tener y portar son permisos distintos, con vigencias distintas.</li>
<li>El titular responde civil y penalmente por el uso del arma; el permiso no traslada esa responsabilidad al Estado.</li>
<li>Hay lugares donde no puedes portar aunque tu permiso esté vigente: colegios, estadios y manifestaciones, entre otros.</li>
</ol>
</section>

<section id="glosario" class="art">
<h2>Glosario</h2>
<div class="c3" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;">
<div class="box"><p style="font-weight: 700;">Causal</p><p style="font-size: 16px; color: #3d3a34;">Circunstancia que excluye la responsabilidad penal.</p></div>
<div class="box"><p style="font-weight: 700;">Tenencia</p><p style="font-size: 16px; color: #3d3a34;">Permiso para tener el arma dentro del inmueble registrado.</p></div>
<div class="box"><p style="font-weight: 700;">Porte</p><p style="font-size: 16px; color: #3d3a34;">Permiso para llevar el arma consigo fuera de ese inmueble.</p></div>
<div class="box"><p style="font-weight: 700;">Agresión actual o inminente</p><p style="font-size: 16px; color: #3d3a34;">La que está ocurriendo o va a ocurrir de inmediato.</p></div>
<div class="box"><p style="font-weight: 700;">Defensa putativa</p><p style="font-size: 16px; color: #3d3a34;">Creer, por error invencible, que existe una agresión.</p></div>
<div class="box"><p style="font-weight: 700;">Exceso</p><p style="font-size: 16px; color: #3d3a34;">Responder más allá de lo necesario: reduce la pena, no la elimina.</p></div>
<div class="box"><p style="font-weight: 700;">Incautación</p><p style="font-size: 16px; color: #3d3a34;">Retención del arma por la autoridad mientras se decide su situación.</p></div>
<div class="box"><p style="font-weight: 700;">DCCAE</p><p style="font-size: 16px; color: #3d3a34;">Departamento de Control Comercio de Armas, Municiones y Explosivos.</p></div>
</div>
</section>

<section id="art32" class="art">
<h2>Artículo 32 del Código Penal</h2>
<p style="color: #3d3a34;">Regula las causales de ausencia de responsabilidad penal. De sus diez numerales, estos son los que importan a quien usa, porta o dispara un arma:</p>
<div style="display: flex; flex-direction: column; gap: 4px;">
<div class="box" style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: baseline;"><span class="d" style="font-size: 28px; color: #c8361b;">Num. 1</span><p>Caso fortuito y fuerza mayor.</p></div>
<div class="box" style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: baseline;"><span class="d" style="font-size: 28px; color: #c8361b;">Num. 6</span><p>Legítima defensa, propia o de terceros.</p></div>
<div class="box" style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: baseline;"><span class="d" style="font-size: 28px; color: #c8361b;">Num. 6.1</span><p>Legítima defensa privilegiada.</p></div>
<div class="box" style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: baseline;"><span class="d" style="font-size: 28px; color: #c8361b;">Num. 7</span><p>Estado de necesidad.</p></div>
<div class="box" style="display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: baseline;"><span class="d" style="font-size: 28px; color: #c8361b;">Num. 10</span><p>Error invencible o legítima defensa putativa.</p></div>
</div>
<p style="color: #3d3a34;">Los numerales 8 y 9, coacción ajena y miedo insuperable, existen pero no se desarrollan aquí. Quien se excede en la legítima defensa o en el estado de necesidad no queda impune: recibe una pena reducida.</p>
</section>

<section id="privilegiada" class="art">
<h2>Legítima defensa privilegiada</h2>
<p style="color: #3d3a34;">Se presume legítima la defensa contra un extraño que entra o se queda sin derecho en tu vivienda, sus dependencias o un vehículo ocupado. Excepcionalmente admite fuerza letal.</p>
<p style="color: #3d3a34;">La carga de la prueba se invierte a tu favor, pero la presunción puede desvirtuarse y la proporcionalidad sigue aplicando.</p>
</section>

<section id="ley2197" class="art">
<h2>Ley 2197 de 2022</h2>
<p style="color: #3d3a34;">Ley de Seguridad Ciudadana, sancionada el 25 de enero de 2022. Reformó el Código Penal, el de Procedimiento Penal, la Ley 1801 de 2016 y el régimen de armas menos letales.</p>
<ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px;">
<li>Amplió la legítima defensa e introdujo la modalidad privilegiada.</li>
<li>Creó delitos como la intimidación con arma de fuego, arma blanca o dispositivos menos letales, y el porte de arma blanca en eventos o transporte masivo.</li>
<li>Estableció permisos para armas menos letales y aumentó agravantes.</li>
</ul>
<p style="color: #57534b; font-size: 16px;">El Decreto 207 de 2022 corrigió errores de numeración del articulado.</p>
</section>

<section id="proporcion" class="art">
<h2>Los cuatro principios de proporcionalidad</h2>
<div class="c3" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;">
<div class="box"><p class="d" style="font-size: 30px; color: #c8361b;">Actualidad</p><p style="font-size: 16px; color: #3d3a34; margin-top: 8px;">La agresión ocurre ahora o es inminente.</p></div>
<div class="box"><p class="d" style="font-size: 30px; color: #c8361b;">Necesidad</p><p style="font-size: 16px; color: #3d3a34; margin-top: 8px;">El medio usado es necesario para repelerla.</p></div>
<div class="box"><p class="d" style="font-size: 30px; color: #c8361b;">Proporción</p><p style="font-size: 16px; color: #3d3a34; margin-top: 8px;">La respuesta guarda relación con el ataque.</p></div>
<div class="box"><p class="d" style="font-size: 30px; color: #c8361b;">Racionalidad</p><p style="font-size: 16px; color: #3d3a34; margin-top: 8px;">La conducta es razonable en las circunstancias.</p></div>
</div>
</section>

<section id="clases" class="art">
<h2>Clases de armas · Decreto 2535</h2>
<div class="box"><p style="font-weight: 700;">Defensa personal · Art. 11</p><p style="font-size: 16px; color: #3d3a34;">Revólveres y pistolas hasta calibre .38, cañón máximo de 6 pulgadas y cargador de hasta 9 cartuchos (10 en .22); carabinas .22 no automáticas; escopetas con cañón de hasta 22 pulgadas.</p></div>
<div class="box"><p style="font-weight: 700;">Otras categorías</p><p style="font-size: 16px; color: #3d3a34;">Deportivas (Art. 12), de colección (Art. 13), de uso restringido (Art. 9, parág. 2) y de guerra, exclusivas de la Fuerza Pública.</p></div>
<div class="box"><p style="font-weight: 700;">Accesorios prohibidos · Art. 15</p><p style="font-size: 16px; color: #3d3a34;">Miras infrarrojas, láser o de amplificación lumínica, y silenciadores.</p></div>
</section>

<section id="permisos" class="art">
<h2>Tenencia, porte y transporte</h2>
<div class="c3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
<div class="box" style="background: #151515; color: #f2efe7;"><p class="d" style="font-size: 48px;">10 años</p><p style="font-size: 16px; color: #cfcabe; margin-top: 8px;">Tenencia, en el inmueble registrado (Art. 16).</p></div>
<div class="box" style="background: #151515; color: #f2efe7;"><p class="d" style="font-size: 48px;">3 años</p><p style="font-size: 16px; color: #cfcabe; margin-top: 8px;">Porte para defensa personal (Arts. 17 y 23).</p></div>
<div class="box" style="background: #151515; color: #f2efe7;"><p class="d" style="font-size: 48px;">1 año</p><p style="font-size: 16px; color: #cfcabe; margin-top: 8px;">Porte de uso restringido.</p></div>
</div>
<ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; color: #3d3a34;">
<li>El DCCAE, del Comando General de las Fuerzas Militares, expide y renueva los permisos.</li>
<li>Transporte (Art. 18): solo para reparación o práctica de tiro autorizada, con el arma descargada.</li>
<li>Viajes en avión (Art. 53): se declara con la aerolínea, se entrega al armerillo de la Policía Aeroportuaria y se reclama en destino.</li>
<li>Pérdida o hurto (Art. 19): avisa por escrito de inmediato, denuncia y entrega el permiso. No avisar en 30 días es sancionable.</li>
</ul>
</section>

<section id="incautacion" class="art">
<h2>Incautación, multas y decomiso</h2>
<p style="color: #3d3a34;">El Art. 85 fija ocho causales de incautación, entre ellas portar sin permiso o con el permiso vencido, bajo efectos de alcohol o sustancias, con la numeración alterada, cederla sin autorización, portarla en eventos restringidos o usarla sin justificación.</p>
<div class="box" style="display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center;"><p class="d" style="font-size: 56px; color: #c8361b;">1 SMMLV</p><p style="font-size: 16px; color: #3d3a34;">Es la multa (Arts. 87 y 90). Si no se paga en 30 días desde la ejecutoria, procede el decomiso definitivo. La decisión se toma en 15 días desde el informe.</p></div>
</section>

<section id="practica" class="art">
<h2>Consideraciones prácticas</h2>
<ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; color: #3d3a34;">
<li>Revisa los lugares prohibidos de la Ley 1801 de 2016 y las restricciones territoriales del Decreto 2535 (Art. 32, parág. 3).</li>
<li>El trámite ante el DCCAE se hace en SIAEM: registro, antecedentes, certificado y video del curso de manejo seguro, y entrevista. La autoridad conserva discrecionalidad.</li>
<li>El permiso autoriza tener o portar, no cualquier uso del arma (Art. 4).</li>
<li>Armas traumáticas y menos letales: Decretos 1417 de 2021 y 1563 de 2022 y Sentencia C-014 de 2023. Si portar una traumática sin permiso configura el delito del Art. 365 sigue en discusión.</li>
</ul>
</section>

<div style="background: #e7e2d6; padding: 30px; font-size: 16px;">
<p style="margin: 0 0 6px; font-weight: 700;">Aviso legal</p>
<p style="margin: 0;">Este contenido es educativo y no constituye asesoría jurídica. Consulta a un abogado penalista y el texto vigente de cada norma en SUIN-Juriscol.</p>
</div>

    var parts = path.split('.');

      var s = scopes[i];
      if (s && Object.prototype.hasOwnProperty.call(s, parts[0])) {
        var v = s[parts[0]];
        for (var j = 1; j < parts.length; j++) { if (v == null) return undefined; v = v[parts[j]]; }
        return v;
      }
    }
    return undefined;
  }
  function interp(str, scopes) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scopes); return v == null ? '' : String(v); });
  }

  function renderNodes(parent, scopes, out) {
    var kids = parent.childNodes;
    for (var i = 0; i < kids.length; i++) renderNode(kids[i], scopes, out);
  }

  function renderNode(node, scopes, out) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      out.push(document.createTextNode(t.indexOf('{{') >= 0 ? interp(t, scopes) : t));
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-if') {
      var raw = node.getAttribute('value') || '';
      var m = raw.match(WHOLE);
      var val = m ? lookup(m[1], scopes) : raw;
      if (val && val !== 'false') renderNodes(node, scopes, out);
      return;
    }
    if (tag === 'sc-for') {
      var lm = (node.getAttribute('list') || '').match(WHOLE);
      var list = lm ? lookup(lm[1], scopes) : [];
      var as = node.getAttribute('as') || 'item';
      (list || []).forEach(function (item, idx) {
        var sc = {}; sc[as] = item; sc.$index = idx;
        renderNodes(node, [sc].concat(scopes), out);
      });
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/1999/xhtml'
      ? document.createElement(tag)
      : document.createElementNS(node.namespaceURI, tag);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a];
      var name = at.name, value = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var whole = value.match(WHOLE);
      if (/^on[a-z]+$/.test(name)) {
        var fn = whole ? lookup(whole[1], scopes) : null;
        if (typeof fn === 'function') {
          var ev = name.slice(2);
          if (ev === 'change' && (tag === 'input' || tag === 'textarea')) ev = 'input';
          el.addEventListener(ev, fn);
        }
        continue;
      }
      if (whole) {
        var v = lookup(whole[1], scopes);
        if (v === false || v == null) {
          if (name.indexOf('aria-') === 0 && v === false) el.setAttribute(name, 'false');
          continue;
        }
        el.setAttribute(name, v === true ? (name.indexOf('aria-') === 0 ? 'true' : '') : String(v));
      } else if (value.indexOf('{{') >= 0) {
        el.setAttribute(name, interp(value, scopes));
      } else {
        el.setAttribute(name, value);
      }
    }
    var children = [];
    renderNodes(node, scopes, children);
    for (var c = 0; c < children.length; c++) el.appendChild(children[c]);
    if (tag === 'input' && el.hasAttribute('value')) el.value = el.getAttribute('value');
    out.push(el);
  }

  var pending = false, first = true;
  function schedule() {
    if (pending) return;
    pending = true;
    Promise.resolve().then(function () { pending = false; render(); });
  }

  function render() {
    var active = document.activeElement;
    var activeId = active && active.id && app.contains(active) ? active.id : null;
    var sel = null;
    try { if (activeId && typeof active.selectionStart === 'number') sel = active.value.length - active.selectionStart; } catch (e) {}
    var openDetails = Array.prototype.map.call(app.querySelectorAll('details'), function (d) { return d.open; });

    var vals = comp.renderVals ? comp.renderVals() : {};
    var out = [];
    renderNodes(tpl.content, [vals], out);
    app.replaceChildren.apply(app, out);

    var ds = app.querySelectorAll('details');
    if (ds.length === openDetails.length) ds.forEach(function (d, i) { if (openDetails[i]) d.open = true; });
    if (activeId) {
      var n = document.getElementById(activeId);
      if (n) {
        n.focus({ preventScroll: true });
        try { if (sel != null && typeof n.setSelectionRange === 'function') { var p = n.value.length - sel; n.setSelectionRange(p, p); } } catch (e) {}
      }
    }
    app.querySelectorAll('form').forEach(function (f) { f.addEventListener('submit', function (e) { e.preventDefault(); }); });
    if (first) {
      first = false;
      if (comp.componentDidMount) try { comp.componentDidMount(); } catch (e) {}
      if (location.hash && location.hash.length > 1) {
        var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }
    }
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var t = id && document.getElementById(id);
    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  });

  render();
})();
</script>
</body>

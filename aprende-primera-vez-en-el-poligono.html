<h1 class="d" style="margin: 0; font-size: clamp(48px, 5.6vw, 88px);">Tu primera vez en el polígono: qué pasa, paso a paso</h1>
<p style="margin: 0; font-size: 21px; max-width: 760px;">Desde que llegas con tu cédula hasta que sales con tu blanco en la mano. Lo que vas a vivir, lo que te van a pedir y cómo prepararte.</p>
<p style="margin: 0; font-size: 15px; color: #57534b;">6 min de lectura · Equipo Polígono Thor</p>
</header>
<figure class="wrap" style="margin: 0 auto; padding-bottom: 8px;">
<div class="ph" style="aspect-ratio: 21 / 9;"><img src="https://images.unsplash.com/photo-1577905027675-fcbe1521b1c8?auto=format&fit=crop&w=1600&q=70" alt="Persona practicando tiro en un polígono" fetchpriority="high" decoding="async"></div>
<figcaption style="margin-top: 10px; font-size: 14px; color: #57534b;">Foto: <a href="https://unsplash.com/photos/man-doing-practice-shooting-3VXaCtUgp-E" style="color: #57534b;">LOGAN WEAVER</a> en Unsplash</figcaption>
</figure>
<div class="wrap" style="padding-top: 48px;">
<div class="prose" style="max-width: 720px; margin: 0 auto;">

<p>Casi todas las personas que llegan por primera vez a un polígono traen la misma mezcla: curiosidad y un poco de nervios. Es normal. Un arma de fuego impone respeto, y ese respeto es justamente el punto de partida de una buena lección. La buena noticia es que no tienes que saber nada antes de venir: el instructor está contigo de principio a fin.</p>
<h2>Antes de salir de casa</h2>
<ul>
<li><strong>Documento original.</strong> Cédula de ciudadanía, cédula de extranjería o pasaporte. Sin documento no se puede ingresar.</li>
<li><strong>Ropa cómoda y cerrada.</strong> Camiseta de cuello alto o redondo (un casquillo caliente dentro de un escote es incómodo) y zapatos cerrados.</li>
<li><strong>Nada de alcohol ni sustancias.</strong> Es una regla del polígono y de sentido común: si llegas bajo sus efectos, no puedes disparar.</li>
<li><strong>Llega con tiempo.</strong> Hay un formulario y una clase teórica antes de la práctica.</li>
</ul>
<h2>Al llegar: registro</h2>
<p>Un asesor te recibe, verifica tu documento y te ayuda a diligenciar el formulario de ingreso. Ahí declaras tus datos y aceptas las condiciones del servicio. Si reservaste en línea, este paso es más rápido.</p>
<h2>La clase teórica</h2>
<p>Antes de tocar un arma, el instructor te explica tres cosas:</p>
<ol>
<li><strong>Las reglas de seguridad</strong>, que se cumplen siempre, dentro y fuera de la pista.</li>
<li><strong>Las partes del arma</strong> que vas a usar: cómo se carga, cómo se descarga, cómo se verifica que está vacía.</li>
<li><strong>Los principios del disparo</strong>: postura, agarre, alineación de miras y control del gatillo.</li>
</ol>
<p>Pregunta todo lo que quieras. No hay preguntas tontas cuando se trata de seguridad.</p>
<h2>En la línea de tiro</h2>
<p>Te pones protección auditiva y gafas. El instructor se ubica a tu lado y no se separa de ti. Primero practicas el agarre y la postura con el arma descargada; luego cargas pocos cartuchos y haces tus primeros disparos con calma, uno a la vez.</p>
<div class="callout"><p><strong>El primer disparo suele sorprender más por el sonido que por el retroceso.</strong> Con la protección auditiva puesta y una buena postura, la mayoría de las personas se sorprende de lo controlable que es.</p></div>
<p>Después de cada serie, el instructor revisa tu blanco contigo y te corrige: un poco más de presión en la mano débil, un gatillo más suave, la vista en la mira delantera. Esa corrección en tiempo real es lo que hace que mejores en una sola sesión.</p>
<h2>Al terminar</h2>
<p>Descargas el arma bajo supervisión, la verificas y la entregas abierta. Y te llevas tu blanco. Si agregaste el certificado DCCAE, queda disponible en el portal al siguiente día hábil.</p>
<h2>Miedos comunes (y lo que realmente pasa)</h2>
<ul>
<li><strong>«Me voy a asustar con el ruido».</strong> La protección auditiva reduce el sonido a un golpe seco. Los primeros dos o tres disparos sorprenden; después te concentras en la técnica.</li>
<li><strong>«El arma me va a golpear».</strong> Con un agarre firme y la postura correcta, el retroceso de una pistola 9 mm o un revólver .38 es moderado. La escopeta se siente más y por eso el instructor te enseña a recibirla con el hombro.</li>
<li><strong>«No voy a atinar».</strong> Nadie espera que atines la primera vez. Al final de la sesión casi todos agrupan sus disparos mucho mejor que al inicio.</li>
</ul>

      }
    }
    var children = [];
    renderNodes(node, scopes, children);
    for (var c = 0; c < children.length; c++) el.appendChild(children[c]);
    if (tag === 'input' && el.hasAttribute('value')) el.value = el.getAttribute('value');
    out.push(el);
  }

  var pending = false, first = true;
  function schedule() {
    if (pending) return;
    pending = true;
    Promise.resolve().then(function () { pending = false; render(); });
  }

  function render() {
    var active = document.activeElement;
    var activeId = active && active.id && app.contains(active) ? active.id : null;
    var sel = null;
    try { if (activeId && typeof active.selectionStart === 'number') sel = active.value.length - active.selectionStart; } catch (e) {}
    var openDetails = Array.prototype.map.call(app.querySelectorAll('details'), function (d) { return d.open; });

    var vals = comp.renderVals ? comp.renderVals() : {};
    var out = [];
    renderNodes(tpl.content, [vals], out);
    app.replaceChildren.apply(app, out);

    var ds = app.querySelectorAll('details');
    if (ds.length === openDetails.length) ds.forEach(function (d, i) { if (openDetails[i]) d.open = true; });
    if (activeId) {
      var n = document.getElementById(activeId);
      if (n) {
        n.focus({ preventScroll: true });
        try { if (sel != null && typeof n.setSelectionRange === 'function') { var p = n.value.length - sel; n.setSelectionRange(p, p); } } catch (e) {}
      }
    }
    app.querySelectorAll('form').forEach(function (f) { f.addEventListener('submit', function (e) { e.preventDefault(); }); });
    if (first) {
      first = false;
      if (comp.componentDidMount) try { comp.componentDidMount(); } catch (e) {}
      if (location.hash && location.hash.length > 1) {
        var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }
    }
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    var t = id && document.getElementById(id);
    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  });

  render();
})();
</script>
</body>
</html>
